name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.asset_os }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            asset_os: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            asset_os: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            asset_os: macos
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            asset_os: macos
            goarch: arm64
            archive: tar.gz
          - goos: windows
            asset_os: windows
            goarch: amd64
            archive: zip
          - goos: windows
            asset_os: windows
            goarch: arm64
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail

          binary_name="costrict-router"
          if [ "$GOOS" = "windows" ]; then
            binary_name="costrict-router.exe"
          fi

          package_name="costrict-router_${VERSION}_${ASSET_OS}_${GOARCH}"
          mkdir -p "build/${package_name}" dist

          go build -trimpath -o "build/${package_name}/${binary_name}" ./cmd/costrict-router

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "build/${package_name}" && zip -9 "../../dist/${package_name}.zip" "${binary_name}")
          else
            (cd "build/${package_name}" && tar -czf "../../dist/${package_name}.tar.gz" "${binary_name}")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.asset_os }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  container:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build
      - container
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_flags=()
          if [[ "${VERSION#v}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--prerelease=false --latest)
          fi

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" \
              --title "${VERSION}" \
              --notes "Release ${VERSION}" \
              "${release_flags[@]}"
            gh release upload "${VERSION}" dist/* --clobber
          else
            gh release create "${VERSION}" dist/* \
              --title "${VERSION}" \
              --notes "Release ${VERSION}" \
              "${release_flags[@]}"
          fi
